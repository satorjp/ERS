services:
  postgres:
    image: postgres:16-alpine
    container_name: it-borrow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: borrow
      POSTGRES_PASSWORD: borrow
      POSTGRES_DB: it_borrow
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U borrow -d it_borrow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
